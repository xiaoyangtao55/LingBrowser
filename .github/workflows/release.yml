name: Build Release

# 在 GitHub 的机器上编译 release APK —— 本地设备编译太慢，
# 推到仓库后由 CI 出包，产物直接在 Actions 页面下载。
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ---------------------------------------------------------------
      # 配置 Android SDK
      #
      # 不用 android-actions/setup-android：它内部会执行
      #   sdkmanager "tools" "platform-tools" ...
      # 而 `tools` 这个包已从 Google 的仓库下架，导致
      #   Warning: Failed to find package 'tools'
      #   Error: The process '.../sdkmanager' failed with exit code 1
      # 整个 job 在第一步就挂掉（与本项目代码无关）。
      #
      # ubuntu runner 自带 Android SDK，这里只补装缺的组件。
      # 直接对具体包名调用 sdkmanager 即可：包不存在时它自己会报
      # "Failed to find package"，我们忽略该错误继续（有 warning 可查）。
      # ---------------------------------------------------------------
      - name: 配置 Android SDK
        run: |
          set -uo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          echo "sdkmanager: $SDKMANAGER"

          # 接受许可（失败无所谓，runner 镜像通常已接受）
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # compileSdk 是 36 + minorApiLevel 1。优先装带小版本的平台，
          # 装不上再退回到不带小版本的 36。
          for pkg in "platform-tools" "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"; do
            echo "--- 安装 $pkg ---"
            if yes | "$SDKMANAGER" "$pkg" > /tmp/sdk.log 2>&1; then
              echo "OK $pkg"
            else
              echo "::warning::$pkg 安装失败（下方为日志尾部，通常表示仓库里没有这个包名）"
              tail -n 5 /tmp/sdk.log || true
            fi
          done

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "已安装的 platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(空)"
          echo "已安装的 build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(空)"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 让 gradlew 可执行
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------
      # 单元测试：地址栏解析、内置主页、图标几何
      # ---------------------------------------------------------------
      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # ---------------------------------------------------------------
      # Release 构建
      #
      # 签名优先用仓库 Secrets 里的密钥库；没配就退化为 unsigned 包，
      # 保证 CI 始终能产出可下载的产物。
      # ---------------------------------------------------------------
      - name: 还原签名密钥库
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/ling-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "已从 Secrets 还原签名密钥库"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "未配置 LING_KEYSTORE_BASE64，将产出未签名 APK（仍可验证编译）"
          fi

      - name: 构建 Release APK
        env:
          LING_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && 'keystore/ling-release.jks' || '' }}
          LING_STORE_PASSWORD: ${{ secrets.LING_STORE_PASSWORD }}
          LING_KEY_ALIAS: ${{ secrets.LING_KEY_ALIAS }}
          LING_KEY_PASSWORD: ${{ secrets.LING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 校验签名与体积
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "产物：$APK"
          ls -lh "$APK"
          if "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose "$APK" 2>/dev/null; then
            echo "签名校验通过"
          else
            echo "::warning::APK 未签名（未配置签名 Secrets）"
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ling-release-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # 打 tag 时自动创建 Release 并附上 APK
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
